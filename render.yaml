# Render Blueprint — deploys BOTH backend (API) and frontend (static site) in one go.
# Render Dashboard -> New -> Blueprint -> select this repo -> Apply.
services:
  # ---------- Backend: FastAPI (Docker, needs Tesseract + LibreOffice) ----------
  - type: web
    name: cv-privacy-watermark-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # "*" works out of the box. After deploy you can tighten it to your frontend URL,
      # e.g. https://cv-privacy-watermark.onrender.com
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "15"

  # ---------- Frontend: React + Vite (static site) ----------
  - type: web
    name: cv-privacy-watermark
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Must match the backend service's public URL above.
      # If Render gives your API a different URL (name already taken), change this value
      # and redeploy the frontend.
      - key: VITE_API_URL
        value: https://cv-privacy-watermark-api-yi23.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
